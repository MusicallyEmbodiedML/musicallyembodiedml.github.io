<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-label="MEMLNaut front panel with the default NISPS controls. Momentary switch A (left): up scrambles the network, down jolts it. Momentary B (right): up likes the current sound, down dislikes it. Toggle A (left) up forgets the memory; toggle B (right) up drags a sound to a new place. Knob X sets the learning rate, Y the reward scale, Z the exploration. The joystick explores; pressing it also drags. The encoder changes screen.">
  <!-- MEMLNaut 0.3 panel, NISPS bindings (InterfaceRL.tpp). Coordinates follow memlnaut_0_3_joystick.jpg offset by (+12, +93). -->
  <defs>
    <radialGradient id="pcb" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#55665a"/><stop offset="1" stop-color="#34453a"/></radialGradient>
  </defs>
  <rect width="1600" height="960" rx="14" fill="#00313a"/>

  <!-- top-edge sockets -->
  <g font-family="Menlo, Consolas, monospace" font-size="15" fill="#eef5e0" text-anchor="middle">
    <g stroke="#eef5e0" stroke-width="1.2" opacity=".5">
      <line x1="372" y1="108" x2="372" y2="150"/><line x1="522" y1="108" x2="522" y2="150"/><line x1="646" y1="80" x2="646" y2="150"/><line x1="725" y1="108" x2="725" y2="150"/><line x1="822" y1="80" x2="822" y2="150"/><line x1="890" y1="108" x2="890" y2="150"/><line x1="970" y1="80" x2="970" y2="150"/>
    </g>
    <text x="372" y="100">MIDI out</text><text x="522" y="100">MIDI in</text>
    <text x="646" y="72">USB-C</text><text x="725" y="100">phones</text>
    <text x="822" y="72">reset</text><text x="890" y="100">boot sel</text><text x="970" y="72">SD card</text>
    <text x="1240" y="72" text-anchor="start" fill="#9fb8b8" font-size="13">sockets on the top edge</text>
  </g>

  <!-- panel -->
  <rect x="58" y="150" width="1484" height="684" rx="6" fill="url(#pcb)"/>
  <g fill="#20291f" opacity=".7"><circle cx="87" cy="177" r="9"/><circle cx="1513" cy="177" r="9"/><circle cx="87" cy="806" r="9"/><circle cx="1513" cy="806" r="9"/></g>
  <text x="372" y="233" font-family="Helvetica, Arial, sans-serif" font-size="44" fill="#eef2ee">MEMLNaut</text>

  <!-- audio jacks, gain -->
  <g fill="#c9cbe0" stroke="#d6b92a" stroke-width="4">
    <circle cx="177" cy="214" r="20"/><circle cx="256" cy="214" r="20"/>
    <circle cx="177" cy="324" r="20"/><circle cx="256" cy="324" r="20"/>
    <circle cx="338" cy="327" r="24"/>
  </g>
  <line x1="338" y1="327" x2="338" y2="306" stroke="#20291f" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#eef2ee" text-anchor="middle">
    <text x="177" y="182">in L</text><text x="256" y="182">in R</text>
    <text x="177" y="292">out L</text><text x="256" y="292">out R</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#eef2ee" text-anchor="middle">
    <text x="338" y="378" font-size="17" font-weight="bold">G · volume</text>
    <text x="338" y="397" font-size="13" fill="#c6d0c8">TR-8S: CC home value</text>
  </g>

  <!-- encoder -->
  <circle cx="575" cy="352" r="26" fill="#c9cbe0" stroke="#d6b92a" stroke-width="4"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="575" y="404" font-size="17" font-weight="bold" fill="#eef2ee">encoder</text>
    <text x="575" y="423" font-size="13" fill="#c6d0c8">turn: change screen</text>
    <text x="575" y="440" font-size="13" fill="#c6d0c8">press: take control</text>
  </g>

  <!-- screen with a sketch of the RL view -->
  <rect x="203" y="460" width="454" height="328" rx="3" fill="#10161a" stroke="#0a0d0f" stroke-width="3"/>
  <text x="223" y="490" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8fa49a">touchscreen · 320×240</text>
  <rect x="223" y="508" width="414" height="1" fill="#2a3a33"/>
  <g fill="#3fae6c">
    <rect x="231" y="640" width="14" height="60"/><rect x="250" y="590" width="14" height="110"/><rect x="269" y="660" width="14" height="40"/><rect x="288" y="560" width="14" height="140"/>
    <rect x="307" y="615" width="14" height="85"/><rect x="326" y="672" width="14" height="28"/><rect x="345" y="600" width="14" height="100"/><rect x="364" y="545" width="14" height="155"/>
    <rect x="383" y="630" width="14" height="70"/><rect x="402" y="580" width="14" height="120"/><rect x="421" y="655" width="14" height="45"/><rect x="440" y="610" width="14" height="90"/>
  </g>
  <g fill="#3b8fd6">
    <rect x="459" y="570" width="14" height="130"/><rect x="478" y="640" width="14" height="60"/><rect x="497" y="600" width="14" height="100"/><rect x="516" y="665" width="14" height="35"/>
    <rect x="535" y="585" width="14" height="115"/><rect x="554" y="625" width="14" height="75"/><rect x="573" y="555" width="14" height="145"/><rect x="592" y="648" width="14" height="52"/><rect x="611" y="605" width="14" height="95"/>
  </g>
  <rect x="223" y="708" width="414" height="1" fill="#2a3a33"/>
  <g font-family="Menlo, Consolas, monospace" font-size="13">
    <text x="223" y="734" fill="#8fa49a">loss 0.012   yes 9 / no 2   last: like</text>
    <text x="223" y="768" fill="#5f7369">RL screen (sketch)</text>
  </g>

  <!-- switches -->
  <g fill="#c9cbe0" stroke="#d6b92a" stroke-width="4">
    <circle cx="829" cy="356" r="24"/><circle cx="994" cy="356" r="24"/>
    <circle cx="829" cy="480" r="24"/><circle cx="994" cy="480" r="24"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="15" fill="#eef2ee" text-anchor="middle">
    <text x="911" y="352">momentary</text><text x="911" y="476">toggle</text>
    <text x="829" y="316" font-size="18">A</text><text x="994" y="316" font-size="18">B</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">
    <text x="790" y="343" fill="#f5b04a"><tspan fill="#eef2ee">▲ </tspan>Scramble</text>
    <text x="790" y="378" fill="#f5b04a"><tspan fill="#eef2ee">▼ </tspan>Jolt</text>
    <text x="790" y="477" fill="#ff7a6e"><tspan fill="#eef2ee">▲ </tspan>Forget all</text>
    <text x="790" y="502" font-size="14" font-weight="normal" fill="#c6d0c8">▼ not used</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">
    <text x="1032" y="343" fill="#5fd38b"><tspan fill="#eef2ee">▲ </tspan>Like</text>
    <text x="1032" y="378" fill="#ff7a6e"><tspan fill="#eef2ee">▼ </tspan>Dislike</text>
    <text x="1032" y="477" fill="#6cb6f5"><tspan fill="#eef2ee">▲ </tspan>Drag (hold)</text>
    <text x="1032" y="502" font-size="14" font-weight="normal" fill="#c6d0c8">▼ mode-specific</text>
  </g>

  <!-- knobs -->
  <g fill="#c9cbe0" stroke="#d6b92a" stroke-width="4">
    <circle cx="912" cy="616" r="25"/><circle cx="800" cy="737" r="25"/><circle cx="1028" cy="737" r="25"/>
  </g>
  <g stroke="#20291f" stroke-width="4" stroke-linecap="round">
    <line x1="912" y1="616" x2="899" y2="596"/><line x1="800" y1="737" x2="815" y2="718"/><line x1="1028" y1="737" x2="1018" y2="715"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#eef2ee">
    <text x="912" y="558" font-size="17" font-weight="bold">Y · reward scale</text>
    <text x="912" y="577" font-size="13" fill="#c6d0c8">some modes: tempo / wet-dry / fade</text>
    <text x="800" y="788" font-size="17" font-weight="bold">X · learning rate</text>
    <text x="800" y="807" font-size="13" fill="#c6d0c8">0 = no learning</text>
    <text x="1028" y="788" font-size="17" font-weight="bold">Z · exploration</text>
    <text x="1028" y="807" font-size="13" fill="#c6d0c8">0 = mapping holds still</text>
  </g>

  <!-- joystick -->
  <circle cx="1312" cy="502" r="126" fill="#c9cbe0"/>
  <circle cx="1312" cy="502" r="58" fill="#aeb1c8"/>
  <circle cx="1312" cy="502" r="26" fill="#2c2f3e"/>
  <g stroke="#2c2f3e" stroke-width="2.5" opacity=".7"><line x1="1312" y1="420" x2="1312" y2="584"/><line x1="1230" y1="502" x2="1394" y2="502"/></g>
  <g font-family="Menlo, Consolas, monospace" font-size="14" fill="#2c2f3e"><text x="1398" y="497">X</text><text x="1318" y="430">Y</text></g>
  <g fill="#20291f" opacity=".7"><circle cx="1206" cy="391" r="4"/><circle cx="1421" cy="391" r="4"/><circle cx="1206" cy="608" r="4"/><circle cx="1421" cy="608" r="4"/></g>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle" fill="#eef2ee">
    <text x="1312" y="664" font-size="19" font-weight="bold">Joystick · explore</text>
    <text x="1312" y="686" font-size="14" fill="#c6d0c8">X · Y · Z, plus W on 4-axis sticks</text>
    <text x="1312" y="712" font-size="16" font-weight="bold" fill="#6cb6f5">press = Drag</text>
  </g>

  <!-- legend -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#eef5e0">
    <rect x="58" y="870" width="14" height="14" rx="2" fill="#5fd38b"/><text x="80" y="882">reward: like</text>
    <rect x="220" y="870" width="14" height="14" rx="2" fill="#ff7a6e"/><text x="242" y="882">reward: dislike / forget</text>
    <rect x="438" y="870" width="14" height="14" rx="2" fill="#f5b04a"/><text x="460" y="882">reshape the network</text>
    <rect x="638" y="870" width="14" height="14" rx="2" fill="#6cb6f5"/><text x="660" y="882">place a sound (hold, move, release)</text>
    <text x="58" y="920" fill="#9fb8b8" font-size="14">▲ / ▼ = switch pushed up / down. Momentary switches spring back; toggles stay where you put them.</text>
  </g>
</svg>
