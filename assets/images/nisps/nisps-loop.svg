<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 270" role="img" aria-label="The NISPS loop: joystick input goes through the neural network to the sound; you react with like, dislike, drag or jolt; the network keeps retraining from your likes and feedback about 200 times a second.">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#eef5e0"/></marker></defs>
  <rect width="580" height="270" rx="10" fill="#00313a"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#eef5e0">
    <rect x="20" y="40" width="120" height="50" rx="5" fill="none" stroke="#eef5e0" stroke-width="1.5"/><text x="80" y="71">joystick</text>
    <rect x="230" y="40" width="120" height="50" rx="5" fill="none" stroke="#eef5e0" stroke-width="1.5"/><text x="290" y="71">network</text>
    <rect x="440" y="40" width="120" height="50" rx="5" fill="none" stroke="#eef5e0" stroke-width="1.5"/><text x="500" y="71">sound</text>
    <rect x="440" y="180" width="120" height="50" rx="5" fill="none" stroke="#5fd38b" stroke-width="2"/><text x="500" y="211">you react</text>
    <rect x="230" y="180" width="120" height="50" rx="5" fill="none" stroke="#eef5e0" stroke-width="1.5"/><text x="290" y="211">memory</text>
  </g>
  <g stroke="#eef5e0" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <line x1="140" y1="65" x2="228" y2="65"/><line x1="350" y1="65" x2="438" y2="65"/>
    <line x1="500" y1="90" x2="500" y2="178"/><line x1="440" y1="205" x2="352" y2="205"/>
    <line x1="290" y1="180" x2="290" y2="92"/>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="12" fill="#9fb8b8">
    <text x="184" y="57" text-anchor="middle">explore</text>
    <text x="394" y="57" text-anchor="middle">parameters</text>
    <text x="508" y="138">listen</text>
    <text x="396" y="198" text-anchor="middle">feedback</text>
    <text x="396" y="254" text-anchor="middle">like · dislike · drag · jolt</text>
    <text x="298" y="132">retrain</text><text x="298" y="147">~200 Hz</text>
  </g>
</svg>
